name: Terraform AWS infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or apply infrastructure
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
concurrency:
  group: terraform-infrastructure
  cancel-in-progress: false
jobs:
  terraform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'exam' }}
      TF_VAR_github_environment: ${{ vars.DEPLOY_ENVIRONMENT || 'exam' }}
      TF_VAR_enable_operating_schedule: 'true'
      TF_VAR_operations_reserved_concurrency: ${{ vars.OPERATIONS_RESERVED_CONCURRENCY || '-1' }}
      TF_VAR_daytime_replicas: ${{ vars.ECS_DESIRED_COUNT || '2' }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_grafana_aws_account_id: ${{ vars.GRAFANA_AWS_ACCOUNT_ID }}
      TF_VAR_grafana_external_id: ${{ vars.GRAFANA_EXTERNAL_ID }}
      TF_VAR_high_availability: ${{ vars.HIGH_AVAILABILITY || 'false' }}
      TF_VAR_database_multi_az: ${{ vars.DATABASE_MULTI_AZ || 'false' }}
      TF_VAR_deletion_protection: ${{ vars.DELETION_PROTECTION || 'false' }}
      TF_VAR_payment_mode: ${{ vars.PAYMENT_MODE || 'fake' }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'smartcanteen/exam/terraform.tfstate' }}
      TF_VAR_enable_https: ${{ vars.ENABLE_HTTPS || 'false' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_domain_name: ${{ vars.APP_DOMAIN }}
      TF_VAR_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_OIDC_PROVIDER_ARN }}
      TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
      TF_VAR_razorpay_public_key: ${{ vars.RAZORPAY_PUBLIC_KEY }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.11.4
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize remote state
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform -chdir=infra/terraform init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform plan -out=release.tfplan -lock-timeout=5m
      - name: Apply the plan from this run
        if: inputs.operation == 'apply'
        run: terraform -chdir=infra/terraform apply -lock-timeout=5m release.tfplan
      - name: Show deployment identifiers
        if: inputs.operation == 'apply'
        run: terraform -chdir=infra/terraform output
