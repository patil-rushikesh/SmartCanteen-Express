name: Grafana provisioning
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Plan or apply Grafana configuration
        type: choice
        options: [plan, apply]
        default: plan
permissions:
  contents: read
concurrency:
  group: grafana-provisioning
  cancel-in-progress: false
jobs:
  grafana:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: observability
    permissions:
      contents: read
      id-token: write
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      GRAFANA_AUTH: ${{ secrets.GRAFANA_AUTH }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.GRAFANA_STATE_KEY || 'smartcanteen/exam/grafana.tfstate' }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_cloudwatch_role_arn: ${{ vars.GRAFANA_CLOUDWATCH_ROLE_ARN }}
      TF_VAR_cluster_name: ${{ vars.ECS_CLUSTER }}
      TF_VAR_database_identifier: ${{ vars.DATABASE_IDENTIFIER }}
      TF_VAR_load_balancer_arn_suffix: ${{ vars.ALB_ARN_SUFFIX }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.11.4
      - name: Check required settings
        run: |
          test -n "$GRAFANA_URL" && test -n "$GRAFANA_AUTH" && test -n "$TF_STATE_BUCKET"
          test -n "$TF_VAR_cloudwatch_role_arn" && test -n "$TF_VAR_cluster_name"
          test -n "$TF_VAR_database_identifier" && test -n "$TF_VAR_load_balancer_arn_suffix"
          case "$GRAFANA_URL" in https://*.grafana.net) ;; *) exit 1 ;; esac
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Initialize Grafana state
        run: |
          terraform -chdir=infra/grafana init -lockfile=readonly \
            -backend-config="bucket=$TF_STATE_BUCKET" -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - run: terraform -chdir=infra/grafana plan -out=grafana.tfplan -lock-timeout=5m
      - if: inputs.operation == 'apply'
        run: terraform -chdir=infra/grafana apply -lock-timeout=5m grafana.tfplan
