name: Operations status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: infrastructure
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT || 'exam' }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Report scheduler, services and database
        shell: bash
        run: |
          set -euo pipefail
          resource_name="smartcanteen-${APP_ENVIRONMENT}"
          {
            echo '### Current operating state'
            echo 'This is a read-only snapshot. Starting/stopping may take several minutes.'
            echo '```'
            TZ=Asia/Kolkata date
            aws lambda get-function-configuration --function-name "${resource_name}-operations" \
              --query '{State:State,LastUpdateStatus:LastUpdateStatus,Timeout:Timeout}'
            aws events describe-rule --name "${resource_name}-operations" \
              --query '{State:State,Schedule:ScheduleExpression}'
            aws ecs describe-services --cluster "$resource_name" \
              --services "${resource_name}-backend" "${resource_name}-frontend" \
              --query '{Services:services[].{Name:serviceName,Desired:desiredCount,Running:runningCount,Pending:pendingCount},Failures:failures}'
            aws rds describe-db-instances --db-instance-identifier "$resource_name" \
              --query 'DBInstances[].{Name:DBInstanceIdentifier,State:DBInstanceStatus}'
            aws cloudwatch describe-alarms --alarm-names "${resource_name}-operations-heartbeat" \
              --query 'MetricAlarms[].{Name:AlarmName,State:StateValue,Reason:StateReason}'
            echo '```'
            echo '### Recent scheduler executions'
            echo '```'
            aws logs filter-log-events --log-group-name "/aws/lambda/${resource_name}-operations" \
              --start-time "$(( ($(date +%s) - 600) * 1000 ))" \
              --filter-pattern 'operatingState' --query 'events[].message' --output text
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
