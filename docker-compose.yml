services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-canteen-app
    environment:
      NODE_ENV: production
      PORT: 8080
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-smart-canteen}
      S3_URL_MODE: ${S3_URL_MODE:-public}
      S3_PRESIGNED_URL_TTL_SECONDS: ${S3_PRESIGNED_URL_TTL_SECONDS:-3600}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      PAYMENT_PROVIDER_MODE: ${PAYMENT_PROVIDER_MODE:-fake}
    ports:
      - "${PORT:-8080}:8080"
    restart: always
