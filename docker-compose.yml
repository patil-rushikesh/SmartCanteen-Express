services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-canteen-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
      SEED_DEMO_DATA: "true"
      PORT: 8080
      CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smart_canteen}?schema=public
      REDIS_URL: redis://redis:6379
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      PAYMENT_PROVIDER_MODE: ${PAYMENT_PROVIDER_MODE:-fake}
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: smart-canteen-frontend
    environment:
      VITE_API_BASE_URL: http://localhost:${PORT:-8080}/api
      VITE_PAYMENT_MODE: ${PAYMENT_PROVIDER_MODE:-fake}
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_key}
      VITE_ENABLE_QA_TOOLS: ${VITE_ENABLE_QA_TOOLS:-true}
    depends_on:
      - app
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: smart-canteen-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_canteen}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smart_canteen}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smart-canteen-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
