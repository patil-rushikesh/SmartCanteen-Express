---
- name: Deploy an immutable release to ECS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    cluster: "{{ lookup('env', 'ECS_CLUSTER') }}"
    service: "{{ lookup('env', 'ECS_SERVICE') }}"
    container: "{{ lookup('env', 'ECS_CONTAINER') | default('backend', true) }}"
    image: "{{ lookup('env', 'IMAGE_URI') }}"
    task_template: "{{ lookup('env', 'ECS_TASK_TEMPLATE') }}"
    replicas: "{{ lookup('env', 'ECS_DESIRED_COUNT') | default('1', true) }}"
    deployment_url: "{{ lookup('env', 'APP_URL') }}"
  tasks:
    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - cluster | length > 0
          - service | length > 0
          - image | length > 0
          - deployment_url is match('^https://') or (lookup('env', 'ALLOW_HTTP_DEMO') == 'true' and deployment_url is match('^http://'))
          - replicas | int > 0
    - name: Migrate and roll out the release
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../scripts/ecs_release.py"
          - --cluster
          - "{{ cluster }}"
          - --service
          - "{{ service }}"
          - --container
          - "{{ container }}"
          - --image
          - "{{ image }}"
          - --template
          - "{{ task_template }}"
          - --desired-count
          - "{{ replicas }}"
      changed_when: true
      when: not ansible_check_mode
    - name: Verify the deployed service through HTTPS
      ansible.builtin.uri:
        url: "{{ deployment_url }}{{ '/api/ready' if container == 'backend' else '/healthz' }}"
        status_code: 200
        validate_certs: true
      register: health
      retries: 12
      delay: 10
      until: health.status == 200
      when: not ansible_check_mode
